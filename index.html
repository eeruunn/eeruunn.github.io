<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>Document</title>
  </head>
  <body>
    <script>
      document.addEventListener("mousemove", function (e) {
        let body = document.querySelector(".homescreen");
        let circle = document.createElement("span");
        circle.classList.add("cursor-circle");
        circle.style.left = -50 + e.offsetX + "px";
        circle.style.top = -50 + e.offsetY + "px";
        body.append(circle);
        setTimeout(function () {
          circle.remove();
        }, 3000);
      });
    </script>
    <div class="main-container">
      <div class="menubar">
        <span class="logo"></span>
        <div class="links">About Me</div>
        <div class="links">Works</div>
        <div class="links">Contact</div>
        <div></div>
        <div class="links" id="clock" style="margin-right: 20px">
          9:13:59 pm
        </div>
      </div>
      <div class="homescreen">
        <div class="desktop-icons">
          <div class="launcher">
            <img src="folder.png" draggable="false" />
            <span>Projects</span>
          </div>

          <div class="launcher">
            <img src="list.png" draggable="false" />
            <span>About</span>
          </div>

          <div class="launcher">
            <img src="contacts.png" draggable="false" />
            <span>Contact</span>
          </div>

          <div class="launcher">
            <img src="cv.png" draggable="false" />
            <span>Resume</span>
          </div>
        </div>
      </div>
      <div class="scanbar">
        <div class="scan"></div>
      </div>
    </div>
    <script>
      function updateClock() {
        const now = new Date();
        const time = now.toLocaleTimeString();
        document.getElementById("clock").textContent = time;
      }
      updateClock();
      setInterval(updateClock, 1000);

      const desktop = document.querySelector(".homescreen");

      document.querySelectorAll(".launcher").forEach((icon) => {
        let offsetX = 0;
        let offsetY = 0;
        let firstDrag = true;

        icon.addEventListener("mousedown", startDrag);

        function startDrag(e) {
          if (firstDrag) {
            const rect = icon.getBoundingClientRect();
            const parent = desktop.getBoundingClientRect();

            icon.style.position = "absolute";
            icon.style.left = rect.left - parent.left + "px";
            icon.style.top = rect.top - parent.top + "px";

            desktop.appendChild(icon);

            firstDrag = false;
          }

          offsetX = e.clientX - icon.offsetLeft;
          offsetY = e.clientY - icon.offsetTop;

          document.addEventListener("mousemove", drag);
          document.addEventListener("mouseup", stopDrag);
        }

        function drag(e) {
          icon.style.left = e.clientX - offsetX + "px";
          icon.style.top = e.clientY - offsetY + "px";
        }

        function stopDrag() {
          document.removeEventListener("mousemove", drag);
          document.removeEventListener("mouseup", stopDrag);
        }
      });

      document.querySelectorAll(".launcher").forEach((icon) => {
        icon.addEventListener("dblclick", (event) => {
          window.location.href = "https://github.com/eeruunn";
        });
      });
    </script>
  </body>
</html>
